<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Sereneque — Coming Soon</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    font: 400 16px/1.6 ui-sans-serif, -apple-system, "Helvetica Neue", sans-serif;
    background: linear-gradient(160deg, #f6f8f7 0%, #e8efec 100%);
    color: #1e2b26; padding: 24px;
  }
  main { text-align: center; max-width: 34rem; }
  h1 { font-size: clamp(2rem, 6vw, 3rem); font-weight: 300; letter-spacing: .12em;
       text-transform: uppercase; margin: 0 0 .5rem; }
  .rule { width: 3rem; height: 1px; background: #7d9b8d; margin: 1.5rem auto; }
  p { margin: 0; color: #4a5f57; }
  .status { margin-top: 2.5rem; font-size: .75rem; letter-spacing: .1em;
            text-transform: uppercase; color: #7d9b8d; }
  code { font-size: .85em; background: #dde7e2; padding: .15em .45em; border-radius: 3px; }
</style>
</head>
<body>
  <main>
    <h1>Sereneque</h1>
    <p>Site in development.</p>
    <div class="rule"></div>
    <p>This is a deployment test page. The real site is on its way.</p>
    <p class="status">Build <code id="build">v1</code> &middot; deployed via Cloudflare Workers</p>
  </main>
</body>
</html>
