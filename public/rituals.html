<style>
  *{box-sizing:border-box}

  .wrap{position:relative;z-index:1;width:100%;max-width:1100px;margin:0 auto;padding:124px 24px 120px;text-align:center}
  body{position:relative}
  @keyframes floaty { 0%, 100% { transform: translateY(-10px); } 50% { transform: translateY(14px); } }
  @keyframes pulseGlow { 0%, 100% { opacity: 0.5; transform: scale(1); } 50% { opacity: 1; transform: scale(1.1); } }
  @keyframes ripple { 0% { transform: scale(0.5); opacity: 0; } 18% { opacity: 0.7; } 65% { opacity: 0.25; } 100% { transform: scale(1.2); opacity: 0; } }
  /* ---- lotus watermark (inner pages: the picture only, it never opens) ---- */
  .sq-wm { position: absolute; top: 0; left: 0; right: 0; height: 700px;
           display: flex; align-items: center; justify-content: center;
           pointer-events: none; overflow: hidden; z-index: 0; transform: translateY(104px); }
  .sq-wm > div { position: absolute; aspect-ratio: 1 / 1; border-radius: 999px; }
  .sq-wm-glow { width: min(880px, 100vw);
                background: radial-gradient(circle, rgba(255, 255, 255, 0.42) 0%, rgba(255, 255, 255, 0) 62%);
                filter: blur(14px); }
  .sq-wm-pulse { width: min(405px, 54vw); border: 1px solid rgba(241, 221, 158, 0.7);
                 animation: pulseGlow 6s ease-in-out infinite; }
  .sq-wm-ripple { width: min(820px, 92vw); border: 1px solid rgba(241, 221, 158, 0.7);
                  animation: ripple 11s cubic-bezier(0.16, 0.8, 0.3, 1) infinite; }
  .sq-wm-ripple-b { animation-delay: 5.5s; }
  .sq-wm img { position: relative; width: min(650px, 88vw); height: auto; opacity: 0.3;
               margin-top: 54px; animation: floaty 9s ease-in-out infinite;
               filter: drop-shadow(0 18px 34px rgba(23, 53, 57, 0.14)); }
  @media (max-width: 760px) { .sq-wm { height: 780px; transform: translateY(134px); } }

  .rule{height:1px;margin:34px auto 44px;max-width:640px;
        background:linear-gradient(90deg,rgba(176,138,53,0) 0%,rgba(176,138,53,.55) 16%,rgba(176,138,53,.6) 50%,rgba(176,138,53,.55) 84%,rgba(176,138,53,0) 100%)}
  h1{margin:22px 0 0;font-family:"Cormorant Garamond",Georgia,serif;font-weight:400;
     font-size:clamp(28px,3.6vw,40px);letter-spacing:.01em}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,270px));justify-content:center;gap:26px}
  figure{margin:0}
  .frame{position:relative;width:100%;aspect-ratio:9/16;border-radius:10px;overflow:hidden;
         background:#8bbcb7;box-shadow:0 14px 40px rgba(20,48,53,.24)}
  .frame video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
  figcaption{margin-top:12px;font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:#587f87}
  footer{border-top:1px solid rgba(176,138,53,.3);padding:12px 24px;display:flex;flex-wrap:wrap;
         align-items:center;gap:10px;justify-content:space-between;width:100%;max-width:1180px;
         margin:auto auto 0;font-size:11px;font-weight:300;color:#3d6a71}

<script>
(function(){
  var LOW=0.12, vids=document.querySelectorAll("video");
  vids.forEach(function(v){ v.muted=true; v.loop=true; v.volume=LOW;
    var p=v.play(); if(p&&p.catch) p.catch(function(){}); });
  function unmute(){
    vids.forEach(function(v){ v.muted=false; v.volume=LOW;
      var p=v.play(); if(p&&p.catch) p.catch(function(){}); });
    ["pointerdown","keydown","touchstart","wheel"].forEach(function(e){
      window.removeEventListener(e,unmute); });
  }
  ["pointerdown","keydown","touchstart","wheel"].forEach(function(e){
    window.addEventListener(e,unmute,{passive:true}); });
})();
</script>
<script>
(function () {
  var BP = 760;

  var css = document.createElement("style");
  css.textContent =
    "html{scrollbar-gutter:stable}" +
    "@media (max-width:" + BP + "px){" +
    "[data-sq-links]{display:none !important}" +
    "nav button[data-sq-cart]{display:none !important}" +
    "#sqBurger{display:flex !important}}" +
    "#sqBurger{display:none;position:fixed;top:16px;right:18px;z-index:120;width:42px;height:42px;" +
    "align-items:center;justify-content:center;flex-direction:column;gap:5px;border-radius:8px;" +
    "border:1px solid rgba(176,138,53,.45);background:rgba(255,255,255,.6);backdrop-filter:blur(10px);cursor:pointer}" +
    "#sqBurger span{display:block;width:18px;height:1.5px;background:#3d6a71;transition:transform .2s ease,opacity .2s ease}" +
    "#sqBurger.on span:nth-child(1){transform:translateY(6.5px) rotate(45deg)}" +
    "#sqBurger.on span:nth-child(2){opacity:0}" +
    "#sqBurger.on span:nth-child(3){transform:translateY(-6.5px) rotate(-45deg)}" +
    "#sqMenu{position:fixed;top:66px;right:18px;z-index:119;min-width:190px;border-radius:10px;overflow:hidden;" +
    "border:1px solid rgba(176,138,53,.35);background:rgba(255,255,255,.96);backdrop-filter:blur(16px);" +
    "box-shadow:0 18px 44px rgba(20,48,53,.22);opacity:0;transform:translateY(-8px);pointer-events:none;" +
    "transition:opacity .18s ease,transform .18s ease}" +
    "#sqMenu.on{opacity:1;transform:translateY(0);pointer-events:auto}" +
    "#sqMenu a{display:block;padding:13px 18px;font-family:'Jost',Helvetica,sans-serif;font-size:13.5px;" +
    "font-weight:300;letter-spacing:.08em;text-transform:uppercase;color:#3d6a71;text-decoration:none;" +
    "border-bottom:1px solid rgba(176,138,53,.16)}" +
    "#sqMenu a:last-child{border-bottom:none}" +
    "#sqMenu a:hover,#sqMenu a.on{background:rgba(176,138,53,.1);color:#8f6d29}";
  document.head.appendChild(css);

  var burger = document.createElement("button");
  burger.id = "sqBurger";
  burger.setAttribute("aria-label", "Menu");
  burger.innerHTML = "<span></span><span></span><span></span>";

  var here = (location.pathname.split("/").pop() || "index.html");
  var menu = document.createElement("nav");
  menu.id = "sqMenu";
  [["Home","index.html"],["Method","method.html"],["Products","catalog.html"],["Rituals","rituals.html"],["Journal","index.html"]]
    .forEach(function (p) {
      var a = document.createElement("a");
      a.textContent = p[0]; a.href = p[1];
      if (p[1] === here) a.className = "on";
      menu.appendChild(a);
    });

  document.body.appendChild(burger);
  document.body.appendChild(menu);

  burger.addEventListener("click", function (e) {
    e.stopPropagation();
    burger.classList.toggle("on"); menu.classList.toggle("on");
  });
  document.addEventListener("click", function (e) {
    if (!menu.contains(e.target) && e.target !== burger) {
      burger.classList.remove("on"); menu.classList.remove("on");
    }
  });

  // the template re-renders, so keep re-tagging what we hide
  function tag() {
    var nav = document.querySelector("nav:not(#sqMenu)");
    if (!nav) return;
    var divs = nav.querySelectorAll("div");
    for (var i = 0; i < divs.length; i++) {
      if (divs[i].querySelectorAll("a").length >= 3) divs[i].setAttribute("data-sq-links", "");
    }
    var b = nav.querySelector("button");
    if (b) b.setAttribute("data-sq-cart", "");
  }
  tag(); setInterval(tag, 500);
})();
</script>
