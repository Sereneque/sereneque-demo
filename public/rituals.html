<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rituals — Sereneque</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:#bcd8d4}
  body{font-family:"Jost","Helvetica Neue",Helvetica,sans-serif;color:#143035;-webkit-font-smoothing:antialiased;
       background:radial-gradient(ellipse 120% 80% at 50% 0%,#d5e8e4 0%,#a9cbc7 45%,#86b6b2 100%);
       background-attachment:fixed;min-height:100vh}
  a{color:#143035;text-decoration:none}
  nav{position:fixed;top:0;left:0;right:0;z-index:60;height:72px;display:flex;align-items:center;
      justify-content:space-between;gap:16px;padding:0 24px;background:rgba(226,239,236,.68);
      backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid rgba(176,138,53,.28)}
  nav .links{display:flex;gap:30px;font-size:13.5px;font-weight:300;letter-spacing:.06em;
             text-transform:uppercase;color:#3d6a71}
  nav .links a{color:#3d6a71;transition:color 180ms ease}
  nav .links a:hover,nav .links a.on{color:#8f6d29}
  .wrap{max-width:1100px;margin:0 auto;padding:124px 24px 110px;text-align:center}
  .rule{height:1px;margin:34px auto 44px;max-width:640px;
        background:linear-gradient(90deg,rgba(176,138,53,0) 0%,rgba(176,138,53,.55) 16%,rgba(176,138,53,.6) 50%,rgba(176,138,53,.55) 84%,rgba(176,138,53,0) 100%)}
  h1{margin:22px 0 0;font-family:"Cormorant Garamond",Georgia,serif;font-weight:400;
     font-size:clamp(28px,3.6vw,40px);letter-spacing:.01em}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,270px));justify-content:center;gap:26px}
  figure{margin:0}
  .frame{position:relative;width:100%;aspect-ratio:9/16;border-radius:10px;overflow:hidden;
         background:#8bbcb7;box-shadow:0 14px 40px rgba(20,48,53,.24)}
  .frame video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
  figcaption{margin-top:12px;font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:#587f87}
  footer{border-top:1px solid rgba(176,138,53,.3);padding:36px 24px;display:flex;flex-wrap:wrap;
         align-items:center;gap:14px;justify-content:space-between;max-width:1180px;margin:0 auto;
         font-size:12.5px;font-weight:300;color:#3d6a71}
</style>
</head>
<body>

<nav>
  <a href="index.html"><img src="sereneque-header-logo.png" alt="Sereneque" style="display:block;height:52px;width:auto"></a>
  <div class="links">
    <a href="method.html">Method</a>
    <a href="catalog.html">Catalog</a>
    <a href="rituals.html" class="on">Rituals</a>
    <a href="index.html">Journal</a>
  </div>
  <span style="width:96px"></span>
</nav>

<div class="wrap">
  <a href="index.html"><img src="sereneque-wordmark-gold.png" alt="Sereneque" style="display:block;margin:0 auto;width:min(280px,62vw);height:auto"></a>
  <h1>Rituals</h1>
  <div class="rule"></div>

  <div class="grid">
    <figure>
      <div class="frame">
        <video src="sereneque-clip.mp4" autoplay muted loop playsinline controls preload="metadata"></video>
      </div>
      <figcaption>Sereneque</figcaption>
    </figure>
    <figure>
      <div class="frame">
        <video src="sereneque-transformation.mp4" autoplay muted loop playsinline controls preload="metadata"></video>
      </div>
      <figcaption>Transformation</figcaption>
    </figure>
  </div>
</div>

<footer>
  <span>&copy; 2026 Sereneque Wellness Method</span>
  <span style="font-size:11px;letter-spacing:.16em;color:#587f87">CALM, BY DESIGN</span>
</footer>

<script>
(function(){
  var LOW=0.12, vids=document.querySelectorAll("video");
  vids.forEach(function(v){ v.muted=true; v.loop=true; v.volume=LOW;
    var p=v.play(); if(p&&p.catch) p.catch(function(){}); });
  function unmute(){
    vids.forEach(function(v){ v.muted=false; v.volume=LOW;
      var p=v.play(); if(p&&p.catch) p.catch(function(){}); });
    ["pointerdown","keydown","touchstart","wheel"].forEach(function(e){
      window.removeEventListener(e,unmute); });
  }
  ["pointerdown","keydown","touchstart","wheel"].forEach(function(e){
    window.addEventListener(e,unmute,{passive:true}); });
})();
</script>
</body>
</html>
